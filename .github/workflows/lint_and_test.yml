name: Perform linting and run tests

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Lint, and Test (${{ matrix.database }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: "! contains(toJSON(github.event.commits.*.message), '[skip ci]')"
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    env:
      COMPOSE_FILE: ${{ matrix.database == 'postgres' && './docker/docker-compose.postgres.ci.yml' || './docker/docker-compose.ci.yml' }}
      DATABASE_ADAPTER: ${{ matrix.database }}
      MIX_ENV: test

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pull prebuilt images
        run: docker compose pull

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./docker/dev.Dockerfile
          load: true
          tags: ${{ matrix.database == 'postgres' && 'pinchyt-postgres-phx:latest' || 'pinchyt-phx:latest' }}
          build-args: DATABASE_ADAPTER=${{ matrix.database }}
          cache-from: type=gha,scope=test-${{ matrix.database }}
          cache-to: type=gha,scope=test-${{ matrix.database }},mode=max

      - name: Run Docker image
        run: docker compose up --detach --no-build

      # NOTE: All exec commands use the -T flag to compensate for
      # a bug in the GitHub Actions runner where its stdin/stderr
      # will erroneously report that it's a TTY.
      # Aside from handling this bug the -T flag is not required
      # See https://github.com/actions/runner/issues/241 and https://github.com/docker/compose/issues/8537
      - name: Install Elixir and JS deps
        run: |
          docker compose exec -T phx mix deps.get && yarn install && cd assets && yarn install && cd ..

      - name: Create and Migrate database
        run: |
          docker compose exec -T phx mix ecto.create
          docker compose exec -T phx mix ecto.migrate

      - name: Run code checks
        run: docker compose exec -T phx mix check --no-fix --no-retry

      - name: Test release automation offline
        if: matrix.database == 'sqlite'
        run: |
          docker compose exec -T phx python3 -c 'import yaml'
          docker compose run --rm --no-deps --entrypoint python3 phx -m unittest discover -s test/tooling -p 'test_*.py' -v

      - name: Cleanup
        if: always()
        run: docker compose down --volumes --remove-orphans

  postgres-schema-migrations:
    name: PostgreSQL schema migration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: "! contains(toJSON(github.event.commits.*.message), '[skip ci]')"
    env:
      COMPOSE_FILE: ./docker/docker-compose.postgres.migrations.yml
      DATABASE_ADAPTER: postgres
      MIX_ENV: test

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./docker/dev.Dockerfile
          load: true
          tags: pinchyt-postgres-migrations-phx:latest
          build-args: DATABASE_ADAPTER=postgres
          cache-from: |
            type=gha,scope=test-schema-postgres
            type=gha,scope=test-postgres
          cache-to: type=gha,scope=test-schema-postgres,mode=max

      - name: Run Docker image
        run: docker compose up --detach --no-build

      - name: Install Elixir dependencies
        run: docker compose exec -T phx mix deps.get

      - name: Run isolated schema migration tests
        run: >-
          docker compose exec -T phx mix test --include migration_schema
          test/pinchflat/database/channel_discovery_migration_postgres_test.exs
          test/pinchflat/database/upload_date_index_migration_postgres_test.exs
          test/pinchflat/database/library_text_migration_postgres_test.exs
          test/pinchflat/database/source_description_migration_postgres_test.exs
          test/pinchflat/database/media_size_migration_postgres_test.exs
          test/pinchflat/sources/directory_move_test.exs

      - name: Cleanup
        if: always()
        run: docker compose down --volumes --remove-orphans
