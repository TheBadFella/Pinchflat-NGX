name: Docker Release

on:
  workflow_dispatch:
    inputs:
      platforms:
        type: choice
        description: 'Build Platforms'
        required: true
        default: 'linux/amd64'
        options:
          - 'linux/amd64'
          - 'linux/amd64,linux/arm64'
      docker_tags:
        type: string
        description: 'Docker tag to publish alongside latest'
        required: true
        default: 'dev'
      publish_latest:
        type: boolean
        description: 'Update latest tags (disable for PR test images)'
        required: true
        default: true

  release:
    types:
      - published

# Prevent concurrent releases - queue them instead
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  # Determine which platforms to build based on trigger type
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      is_multi_arch: ${{ steps.set-matrix.outputs.is_multi_arch }}
    steps:
      - name: Determine build matrix
        id: set-matrix
        run: |
          # Published releases build both architectures
          # workflow_dispatch uses the selected platforms input

          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo 'matrix={"include":[{"platform":"linux/amd64","runner":"ubuntu-latest","database":"sqlite"},{"platform":"linux/amd64","runner":"ubuntu-latest","database":"postgres"},{"platform":"linux/arm64","runner":"ubuntu-24.04-arm","database":"sqlite"},{"platform":"linux/arm64","runner":"ubuntu-24.04-arm","database":"postgres"}]}' >> "$GITHUB_OUTPUT"
            echo "is_multi_arch=true" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            PLATFORMS="${{ inputs.platforms }}"
            if [[ "$PLATFORMS" == *"arm64"* ]]; then
              echo 'matrix={"include":[{"platform":"linux/amd64","runner":"ubuntu-latest","database":"sqlite"},{"platform":"linux/amd64","runner":"ubuntu-latest","database":"postgres"},{"platform":"linux/arm64","runner":"ubuntu-24.04-arm","database":"sqlite"},{"platform":"linux/arm64","runner":"ubuntu-24.04-arm","database":"postgres"}]}' >> "$GITHUB_OUTPUT"
              echo "is_multi_arch=true" >> "$GITHUB_OUTPUT"
            else
              echo 'matrix={"include":[{"platform":"linux/amd64","runner":"ubuntu-latest","database":"sqlite"},{"platform":"linux/amd64","runner":"ubuntu-latest","database":"postgres"}]}' >> "$GITHUB_OUTPUT"
              echo "is_multi_arch=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo 'matrix={"include":[{"platform":"linux/amd64","runner":"ubuntu-latest","database":"sqlite"},{"platform":"linux/amd64","runner":"ubuntu-latest","database":"postgres"},{"platform":"linux/arm64","runner":"ubuntu-24.04-arm","database":"sqlite"},{"platform":"linux/arm64","runner":"ubuntu-24.04-arm","database":"postgres"}]}' >> "$GITHUB_OUTPUT"
            echo "is_multi_arch=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Prepare environment
        run: |
          platform="${{ matrix.platform }}"
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          {
            echo "PLATFORM_PAIR=${platform//\//-}"
            echo "IMAGE_NAME=${owner}/pinchflat-ngx"
            echo "LEGACY_IMAGE_NAME=${owner}/pinchyt"
            echo "YT_DLP_CACHE_BUST=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.database }}-${platform//\//-}"
          } >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ env.REGISTRY }}/${{ env.LEGACY_IMAGE_NAME }}
          flavor: |
            latest=false

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./docker/selfhosted.Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            DATABASE_ADAPTER=${{ matrix.database }}
            YT_DLP_CACHE_BUST=${{ env.YT_DLP_CACHE_BUST }}
            BUILD_TRACK=stable
            BUILD_SHA=${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=build-${{ matrix.database }}-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,scope=build-${{ matrix.database }}-${{ env.PLATFORM_PAIR }},mode=max
          sbom: true
          provenance: true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.database }}-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        database: [sqlite, postgres]
    steps:
      - name: Prepare environment
        run: |
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          {
            echo "IMAGE_NAME=${owner}/pinchflat-ngx"
            echo "LEGACY_IMAGE_NAME=${owner}/pinchyt"
          } >> "$GITHUB_ENV"

      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-${{ matrix.database }}-*
          path: /tmp/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ env.REGISTRY }}/${{ env.LEGACY_IMAGE_NAME }}
          # Disable the action's automatic `latest` tag. Both sqlite and postgres
          # merge jobs run on the same git tag; latest=auto would apply `latest`
          # to whichever job finished last, including postgres.
          flavor: |
            latest=false
          # SQLite is `latest` and `<version>`. PostgreSQL is `latest-postgres`
          # and `<version>-postgres`. Moving tags are only written on published
          # GitHub releases and manual workflow runs.
          tags: |
            type=ref,event=tag,suffix=${{ matrix.database == 'postgres' && '-postgres' || '' }}
            type=raw,value=${{ matrix.database == 'postgres' && 'latest-postgres' || 'latest' }},enable=${{ github.ref_type == 'tag' || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish_latest) }}
            type=raw,value=${{ matrix.database == 'postgres' && format('{0}-postgres', inputs.docker_tags) || inputs.docker_tags }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          # shellcheck disable=SC2046
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
